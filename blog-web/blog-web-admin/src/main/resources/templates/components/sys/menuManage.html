<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统菜单管理</title>
    <link rel="stylesheet" th:href="@{/webjars/element/css/index.css}">
    <link rel="stylesheet" th:href="@{/webjars/icon-font/iconfont.css}">
</head>
<body>
<th:block th:replace="emglobal::em-global"></th:block>
<section id="main-content" class="animated fadeInUp">
<div id="menuManage">
    <el-container style="background: #FFF">
        <el-header>
            <el-form :model="queryParams" ref="queryForm" size="small" :inline="true" v-show="showSearch">
                <el-form-item label="菜单名称" prop="menuName">
                    <el-input
                            v-model="queryParams.menuName"
                            placeholder="请输入菜单名称"
                            clearable
                            @keyup.enter.native="handleQuery"
                    />
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="菜单状态" clearable>
                        <el-option
                                v-for="item in options"
                                :key="item.value"
                                :label="item.label"
                                :value="item.value">
                        </el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button
                            type="primary"
                            plain
                            icon="el-icon-plus"
                            size="mini"
                            @click="handleAdd"
                    >新增</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button
                            type="info"
                            plain
                            icon="el-icon-sort"
                            size="mini"
                            @click="toggleExpandAll"
                    >展开/折叠</el-button>
                </el-col>
            </el-row>
        </el-header>
        <el-main style="padding-right: 200px;">
            <el-table
                    v-if="refreshTable"
                    v-loading="loading"
                    :data="menuList"
                    row-key="menuId"
                    :default-expand-all="isExpandAll"
                    :tree-props="{children: 'children', hasChildren: 'hasChildren'}"
            >
                <el-table-column prop="menuName" label="菜单名称" :show-overflow-tooltip="true" width="160"></el-table-column>
                <el-table-column prop="icon" label="图标" align="center" width="100">
                    <template slot-scope="scope">
<!--                        <svg-icon :icon-class="scope.row.icon" />-->
                        <i :class="scope.row.icon"></i>
                    </template>
                </el-table-column>
                <el-table-column prop="orderNum" label="排序" width="60"></el-table-column>
                <el-table-column prop="perms" label="权限标识" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column prop="path" label="组件路径" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column prop="status" label="状态" width="80">
                    <template slot-scope="scope">
                        <el-tag v-if="scope.row.status == 0" type="success">正常</el-tag>
                        <el-tag v-if="scope.row.status == 1" type="warning">停用</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="操作" align="center" class-name="small-padding fixed-width">
                    <template slot-scope="scope">
                        <el-button
                                size="mini"
                                type="text"
                                icon="el-icon-edit"
                                @click="handleUpdate(scope.row)"
                        >修改</el-button>
                        <el-button
                                size="mini"
                                type="text"
                                icon="el-icon-plus"
                                @click="handleAdd(scope.row)"
                        >新增</el-button>
                        <el-button
                                size="mini"
                                type="text"
                                icon="el-icon-delete"
                                @click="handleDelete(scope.row)"
                        >删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 添加或修改菜单对话框 -->
            <el-dialog :title="title" :visible.sync="open" width="680px" append-to-body>
                <el-form ref="menuForm" :model="form" :rules="rules" label-width="100px">
                    <el-row>
                        <el-col :span="24">
                            <el-form-item label="上级菜单" prop="parentId">
                                <el-input
                                        v-model="form.parentId"
                                        :disabled="true">
                                </el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="24">
                            <el-form-item label="菜单类型" prop="menuType">
                                <el-radio-group v-model="form.menuType">
                                    <el-radio label="M">目录</el-radio>
                                    <el-radio label="C">菜单</el-radio>
                                    <el-radio label="F">按钮</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                        <el-col :span="24" v-if="form.menuType != 'F'">
                            <el-form-item label="菜单图标" prop="icon">
                                <el-popover
                                        placement="bottom-start"
                                        width="460"
                                        trigger="click"
                                        @show="$refs['iconSelect'].reset()"
                                >
                                    <IconSelect ref="iconSelect" @selected="selected" :active-icon="form.icon" />
                                    <el-input slot="reference" v-model="form.icon" placeholder="点击选择图标" readonly>
                                        <i :class="form.icon"></i>
                                    </el-input>
                                </el-popover>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="菜单名称" prop="menuName">
                                <el-input v-model="form.menuName" placeholder="请输入菜单名称" />
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="显示排序" prop="orderNum">
                                <el-input-number v-model="form.orderNum" controls-position="right" :min="0" />
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType != 'F'">
                            <el-form-item prop="isFrame">
                                <span slot="label">
                                    <el-tooltip content="选择是外链则路由地址需要以`http(s)://`开头" placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    是否外链
                                </span>
                                <el-radio-group v-model="form.isFrame">
                                    <el-radio label="0">是</el-radio>
                                    <el-radio label="1">否</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType != 'F'">
                            <el-form-item prop="path">
                                <span slot="label">
                                    <el-tooltip content="访问的路由地址，如：`user`，如外网地址需内链访问则以`http(s)://`开头" placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    路由地址
                                </span>
                                <el-input v-model="form.path" placeholder="请输入路由地址" />
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType == 'C'">
                            <el-form-item prop="component">
                                <span slot="label">
                                    <el-tooltip content="访问的组件路径，如：`system/user/index`，默认在`views`目录下" placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    组件路径
                                </span>
                                <el-input v-model="form.component" placeholder="请输入组件路径" />
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType != 'M'">
                            <el-form-item prop="perms">
                                <el-input v-model="form.perms" placeholder="请输入权限标识" maxlength="100" />
                                <span slot="label">
                                    <el-tooltip content="控制器中定义的权限字符，如：@PreAuthorize(`@ss.hasPermi('system:user:list')`)" placement="top">
                                        <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    权限字符
                                </span>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType == 'C'">
                            <el-form-item prop="query">
                                <el-input v-model="form.query" placeholder="请输入路由参数" maxlength="255" />
                                <span slot="label">
                                    <el-tooltip content='访问路由的默认传递参数，如：`{"id": 1, "name": "ry"}`' placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    路由参数
                                </span>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType == 'C'">
                            <el-form-item prop="isCache">
                                <span slot="label">
                                    <el-tooltip content="选择是则会被`keep-alive`缓存，需要匹配组件的`name`和地址保持一致" placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    是否缓存
                                </span>
                                <el-radio-group v-model="form.isCache">
                                    <el-radio label="0">缓存</el-radio>
                                    <el-radio label="1">不缓存</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12" v-if="form.menuType != 'F'">
                            <el-form-item prop="visible">
                                <span slot="label">
                                    <el-tooltip content="选择隐藏则路由将不会出现在侧边栏，但仍然可以访问" placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    显示状态
                                </span>
                                <el-radio-group v-model="form.visible">
                                    <el-radio label="0">显示</el-radio>
                                    <el-radio label="1">隐藏</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item prop="status">
                                <span slot="label">
                                    <el-tooltip content="选择停用则路由将不会出现在侧边栏，也不能被访问" placement="top">
                                    <i class="el-icon-question"></i>
                                    </el-tooltip>
                                    菜单状态
                                </span>
                                <el-radio-group v-model="form.status">
                                    <el-radio label="0">正常</el-radio>
                                    <el-radio label="1">停用</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                    </el-row>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button type="primary" @click="submitForm">确 定</el-button>
                    <el-button @click="cancel">取 消</el-button>
                </div>
            </el-dialog>
        </el-main>
    </el-container>
</div>
</section>
</body>
<script th:src="@{/webjars/element/js/index.js}"></script>
<script th:src="@{/js/sys/menuManage.js}"></script>
<style>

</style>
</html>
