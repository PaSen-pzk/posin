<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
</head>

<body>

<div th:fragment="forward-iframe">
    <th:block th:replace="emglobal::em-global"></th:block>
    <div class="pageheader">
      <h1>{{navigation.name}}</h1>
      <p class="description">{{navigation.title}}</p>
      <div class="breadcrumb-wrapper hidden-xs">
        <span class="label">You are here:</span>
        <ol class="breadcrumb">
          <li class="active">Dashboard</li>
        </ol>
      </div>
    </div>
    <section id="main-content" class="animated fadeInUp">
      <iframe id="sub-iframe" :src="navigation.forwardPath"></iframe>
    </section>
</div>
</body>

</html>
