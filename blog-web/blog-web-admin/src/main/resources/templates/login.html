<html class="no-js" xmlns:th="http://www.thymeleaf.org">
<!--<![endif]-->

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>登录</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Fonts  -->
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/simple-line-icons.css}">
    <!-- CSS Animate -->
    <link rel="stylesheet" th:href="@{/css/animate.css}">
    <!-- Custom styles for this theme -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- Feature detection -->
    <script th:src="@{/js/modernizr-2.6.2.min.js}"></script>
    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
    <script src="assets/js/vendor/html5shiv.js"></script>
    <script src="assets/js/vendor/respond.min.js"></script>
    <![endif]-->
</head>

<body>
    <th:block th:replace="emglobal::em-global"></th:block>
    <section class="container animated fadeInUp">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <div id="login-wrapper">
                    <header>
                        <div class="brand">
                            <a href="index.html" class="logo">
                                <i class="icon-layers"></i>
                                <span>NEU</span>BOARD</a>
                        </div>
                    </header>
                    <div class="panel panel-primary">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                           Sign In
                        </h3>
                        </div>
                        <div class="panel-body">
                            <p> Login to access your account.</p>
                            <form class="form-horizontal" role="form">
                                <div class="form-group">
                                    <div class="col-md-12">
                                        <input type="text" class="form-control" id="username" placeholder="Username">
                                        <i class="fa fa-user"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-md-12">
                                        <input type="password" class="form-control" id="password" placeholder="Password">
                                        <i class="fa fa-lock"></i>
                                        <a href="javascript:void(0)" class="help-block">Forgot Your Password?</a>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-md-12">
                                        <a href="javascript:void(0)" class="btn btn-primary btn-block login-button">Sign in</a>
                                        <hr>
                                        <a href="pages-sign-up.html" class="btn btn-default btn-block">Not a member? Sign Up</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>
    <!--Global JS-->
    <script th:src="@{/js/jquery-1.11.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/jquery.navgoco.min.js}"></script>
    <script th:src="@{/js/pace.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script type="text/javascript">
        document.querySelector(".login-button").onclick = function(){
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            if(!username) {
                showErrorMessage("The username is empty")
            }
            if(!password) {
                showErrorMessage("The password is empty")
            }
            let param = {
                username: username,
                password: password
            }
            axios.post(getDataBaseUrl().concat(ADMIN_SERVER.SYS_LOGIN), param).then(function (response) {
                console.log(response.data)
                let res = response.data;
                if(res.code == SERVICE_RESPONSE.SUCCESS.CODE){
                    console.log("登录成功")
                    sessionStorage.setItem("X-AUTH-TOKEN", res.data.token);
                    window.location.href = getPageBaseUrl().concat("/index");
                    history.pushState(null, null, window.location.href);
                } else {
                    setTimeout(function(){
                        removeClass(document.querySelector(".login"), "active")
                        removeClass(document.querySelector(".sk-rotating-plane"), "active")
                        document.querySelector(".login").style.display = "block"
                        // alert("登录成功")
                    },5000)
                }
            }).catch(function (error) {
                console.log(error);
            });
        }
    </script>
</body>

</html>
